name: CI

on:
  # EVERY branch, not just master and release/**. The narrow filter meant a
  # branch that never opened a PR was never verified at all: eight commits
  # touching 3,700 lines of Dart landed on `claude/performance`, were merged to
  # master, and the FIRST time they ran on macOS or Windows was after the merge
  # — where two of the four runners promptly failed. CI that only watches the
  # branch you have already merged into is CI that reports history.
  #
  # The cost is runner minutes on feature branches; the concurrency group below
  # already cancels superseded runs, and a wasted build is much cheaper than
  # discovering a break once it is on master.
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run; three-OS desktop
# builds are slow enough that queueing them up is wasteful.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Flutter application (AGPL tier). Builds BEFORE testing on purpose: the
  # desktop build is what puts the bundled SQLite next to the runner, and
  # test/support/sqlite.dart skips every storage test when it can't find one.
  # Under CI that helper throws instead of skipping, so a broken build can't
  # masquerade as a green test run.
  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, NOT ubuntu-latest: release.yml pins its Linux job to
        # this exact label, so this is the host releases are actually built
        # on — the one whose breakage matters. Both labels were run for a
        # while "for when they diverge", but they are the same image today,
        # so the second job could only ever repeat the first's answer at the
        # cost of a full build per push. When ubuntu-latest does move on, the
        # pin keeps testing the release host, which is the promise this
        # matrix exists to keep. (24.04 rather than 22.04 for the libmpv
        # soname — see the comment on release.yml's linux job.)
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libmpv-dev and libepoxy-dev are media_kit_video's: its Linux plugin
          # links against both through pkg-config, so without them the plugin
          # silently drops out of the build and video does not exist.
          # --no-install-recommends: libgtk-3-dev alone drags in tens of
          # recommended packages nothing here links against. The explicit
          # list IS the dependency set, so recommends are pure download time.
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev libepoxy-dev

      # The CMake hook now builds the Rust core during `flutter build` when
      # cargo is present (it is, on all GitHub runners) — cache it or every
      # app build pays a cold lto/codegen-units=1 compile.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/onote_core

      # macOS is the ONLY platform where `flutter build` does not build the Rust
      # core. app/windows/CMakeLists.txt and app/linux/CMakeLists.txt both
      # invoke cargo; the Xcode project has no equivalent, which is why
      # release.yml carries an explicit cargo step for macOS and not for the
      # others.
      #
      # Without it `OnoteCore.instance` is null here, and every test that
      # reaches `ImportJob.start` dies on the `OneNoteUnavailable` throw at
      # import_job.dart:110 — four tests, on macOS only, passing everywhere
      # else. ("one at a time" survived because it returns one line earlier, at
      # the already-running check, which is precisely why that ordering was
      # chosen.) The loader picks the library up from
      # `../rust/onote_core/target/release/` relative to `app/`.
      #
      # The real gap is that macOS lacks the build hook at all — a developer
      # running `flutter build macos` gets an app with no core. Fixing that
      # needs an Xcode build phase and a Mac to verify it on; this makes CI
      # honest in the meantime.
      - name: Build Rust core (macOS has no build hook)
        if: runner.os == 'macOS'
        working-directory: rust/onote_core
        run: cargo build --release

      # PINNED for determinism: `channel: stable` resolves whatever is
      # stable at run time, so an SDK release can change what CI analyzes
      # and builds with under every branch at once, with no commit to bisect.
      # The lockfile pins the packages; this pins the other input, and
      # upgrading becomes a deliberate one-line bump made together with
      # whatever new diagnostics the new SDK brings. Keep it in step with
      # release.yml, which pins the same version so a tag never builds with
      # a toolchain CI has not tested.
      #
      # For the record: this pin was first written in the belief that 3.44.9
      # had caused the two-day analyze failure. It had not — the failure was
      # a real `unused_field` warning in the tree, invisible locally only
      # because a dev-side check filtered analyzer output and echoed
      # "analyze ok" unconditionally. The pin stays because determinism is
      # right on its own merits, not because it fixed that.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # Errors and warnings are fatal; infos are not. That is the bar
      # CONTRIBUTING.md states, so CI enforces exactly it and no more.
      #
      # Linux only: analysis reads the same Dart against the same resolved
      # packages on every OS, so three copies of this step can only agree.
      # It was 23 s of the Windows job — the critical path of the whole
      # workflow, since the run finishes when its slowest job does.
      - name: Analyze
        if: runner.os == 'Linux'
        run: flutter analyze --no-fatal-infos

      # pdfrx bundles PDFium as a WASM module for its web target, and its
      # `assets/` declaration ships it on every platform — 4.0 MB of a 101 MB
      # Windows bundle that nothing on desktop can execute. The package
      # documents this exact command for release builds, and the debug banner
      # nags about it on every run.
      #
      # Between `pub get` and `build`, because `pub get` restores the files.
      - name: Drop the PDFium WASM module (desktop cannot run it)
        run: dart run pdfrx:remove_wasm_modules
        working-directory: app

      # media_kit's HLS shim and wakelock_plus's no-sleep shim are browser
      # payloads that desktop never loads. See app/tool/strip_web_assets.dart.
      - name: Drop other packages' web-only assets
        run: dart run tool/strip_web_assets.dart
        working-directory: app

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: flutter build linux --release

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: flutter build macos --release

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: flutter build windows --release

      # Flutter's desktop build never subsets the Material icon font, because
      # `tool_backend.dart` passes `-dTreeShakeIcons="true"` WITH the quotes
      # and the shaker tests for `true` without them. 1.6 MB shipped whole in
      # every Windows and Linux release. macOS is unaffected and this is a
      # no-op there. See app/tool/shake_icons.dart.
      # Linux only, and in CI this is a SMOKE TEST of the tool, not
      # packaging: release.yml runs it for real on every platform at tag
      # time. One run per push proves the tool still works against a fresh
      # build; the Windows copy bought no extra coverage and cost 60 s of
      # the slowest job.
      - name: Subset the icon font (works around a Flutter SDK bug)
        if: runner.os == 'Linux'
        run: dart run tool/shake_icons.dart
        working-directory: app

      # The github reporter annotates failures in the PR view and stays
      # quiet on success — `expanded` streamed a line per test (1,000+) into
      # the log websocket, which is not free on a Windows runner.
      - name: Test
        env:
          CI: 'true'
        run: flutter test --reporter github

  # The Rust core (Apache-2.0 tier). Independent of Flutter by design — the core
  # is meant to be usable standalone, so CI proves it builds and tests without a
  # Flutter toolchain anywhere in sight.
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: rust/onote_core
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/onote_core

      - run: cargo test --all-targets

      # `-D warnings` reaches only the primary package, not dependencies, so the
      # vendored `cab` copy's own style lints don't fail the build. Keep it that
      # way: silencing them would mean editing the vendored crate beyond its
      # documented two-method patch (see vendor/cab/OPENOTE-PATCH.md).
      - name: Clippy
        run: cargo clippy -p onote_core --all-targets -- -D warnings

  # Guards the licensing invariant recorded in ADR-0005: onote_core is the
  # permissive tier, and a single copyleft crate in its dependency graph would
  # silently void the promise that anyone can read and write .onote files.
  licence-invariant:
    name: core stays permissive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check dependency licences
        working-directory: rust/onote_core
        run: cargo deny check licenses
