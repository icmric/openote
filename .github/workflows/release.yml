name: Release

# Tag-triggered release builds (v0.2.0 → tag v0.2.0). Cut tags only from a
# green master: this workflow does not re-run tests (CI gates every push); it
# builds, packages, and DRAFTS the release for human review — nothing goes
# public without a person pressing publish.
#
# The explicit `cargo build` steps are kept even though the CMake hook now
# builds the core during `flutter build` on Windows/Linux: release artifacts
# must not depend on the hook alone, and macOS has no hook (Xcode project).
on:
  push:
    tags: ['v*']
  # A dry run: build and package everything, upload the artifacts, and create
  # NO release. Added because the platform jobs went un-run for their whole
  # existence — the only way to exercise them was to cut a real tag, and a tag
  # that fails leaves a half-made release and a name that has to be deleted in
  # two places before it can be reused. Now the expensive, breakable half can
  # be tried on demand.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 0.3.0 (must match app/pubspec.yaml). Builds artifacts only — no release is created.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Single source of truth: the git tag. Fails fast when app/pubspec.yaml
  # disagrees so the two can never drift silently — bump pubspec, commit, then
  # tag. (pubspec is 'M.m.p+build'; only M.m.p is compared.)
  version:
    name: derive version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"     # a dry run names its own version
          else
            VERSION="${GITHUB_REF_NAME#v}"   # a tag IS the version
          fi
          PUBSPEC="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' app/pubspec.yaml)"
          if [ "$VERSION" != "$PUBSPEC" ]; then
            echo "::error::version ${VERSION} does not match app/pubspec.yaml version ${PUBSPEC}."
            echo "::error::Bump app/pubspec.yaml, commit and PUSH, then delete the tag in BOTH places (git tag -d v${VERSION} AND git push --delete origin v${VERSION}) before re-tagging — a stale local tag is the usual cause."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Refuse to run against a tag that ALREADY has a release.
      #
      # `draft: true` in the release job is not the safety net it looks like.
      # softprops/action-gh-release only honours it on the CREATE path; when a
      # release already exists for the tag it takes the update path and passes
      # `draft: existingRelease.draft` verbatim. So re-running a tag whose
      # release was published would attach every installer to a LIVE public
      # release, overwrite its title and body with the draft text — comment
      # marker and all — and never once pause for the human review this
      # workflow's own header promises.
      #
      # This is the exact shape of the 0.3.0 incident: the first tag failed the
      # guard above, a release was created by hand to compensate, and the tag
      # was then a loaded gun. Fail in eight seconds instead of at minute forty.
      - name: Refuse to overwrite an existing release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::A release already exists for ${TAG}."
            echo "::error::Publishing into it would bypass the draft review step entirely."
            echo "::error::Delete that release (and this tag) first, or ship the next patch version."
            exit 1
          fi

  windows:
    name: windows x64
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/onote_core

      - name: Build Rust core
        working-directory: rust/onote_core
        run: cargo build --release

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build app
        working-directory: app
        run: |
          flutter pub get
          # 4.0 MB of web-only PDFium WASM that desktop cannot execute; the
          # package documents this command for release builds.
          dart run pdfrx:remove_wasm_modules
          dart run tool/strip_web_assets.dart
          flutter build windows --release --build-name=$env:VERSION
          dart run tool/shake_icons.dart windows

      # The FFI loader (app/lib/core/onote_ffi.dart) looks next to the exe
      # first — the DLL must sit beside openote.exe in the zip. The CMake hook
      # already bundles it; the explicit copy is belt-and-braces.
      - name: Package zip (DLL next to the exe)
        shell: pwsh
        run: |
          $stage = "openote-$env:VERSION-windows-x64"
          Copy-Item -Recurse app/build/windows/x64/runner/Release $stage
          Copy-Item rust/onote_core/target/release/onote_core.dll $stage/ -Force
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

      # The setup .exe — what a non-technical user should be downloading.
      # The zip stays beside it: it is the answer for a locked-down machine, a
      # USB stick, or someone who wants to look inside before running anything,
      # and keeping it costs one line.
      #
      # Inno Setup is not preinstalled on the runner.
      #
      # NOT pinned to an exact version, which reverses an earlier decision, and
      # the reversal has a reason. The pin was 6.2.2 — and openote.iss uses
      # `ArchitecturesAllowed=x64compatible`, which Inno Setup only understands
      # from 6.3. A pin that cannot compile the script it is pinned for is not
      # caution, it is a guaranteed failure. Verifying the floor is the part
      # that was actually worth having, so that is what the next step does.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # ${env:ProgramFiles(x86)} — the BRACES are load-bearing. PowerShell
          # ends an unbraced variable name at the first character that cannot
          # appear in one, and `(` is one of those: "$env:ProgramFiles(x86)\..."
          # expands to "C:\Program Files(x86)\...", a path that does not exist.
          # The step then failed on a directory nobody had ever typed.
          # Find ISCC rather than hardcoding 'Inno Setup 6': the install step
          # above is deliberately unpinned, so a future chocolatey package that
          # ships 7.x would land in a directory this path does not name — and
          # the failure would arrive after the whole Rust + Flutter build.
          #
          # Look in the conventional 'Inno Setup <n>' directories FIRST. The
          # recursive sweep below is the fallback, not the default: recursing
          # both Program Files trees took 4m24s on the runner, and every second
          # of it was spent after the Rust and Flutter builds had already run.
          $roots = @(${env:ProgramFiles(x86)}, $env:ProgramFiles) | Where-Object { $_ }
          $candidates = Get-ChildItem -Path $roots -Filter 'Inno Setup*' -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName 'ISCC.exe' } |
            Where-Object { Test-Path $_ } |
            Sort-Object { if ($_ -match 'Inno Setup\s+(\d+)') { [int]$Matches[1] } else { 0 } }
          $iscc = $candidates | Select-Object -Last 1
          if (-not $iscc) {
            $iscc = Get-ChildItem -Path $roots -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -Last 1 -ExpandProperty FullName
          }
          if (-not $iscc) {
            throw "ISCC.exe not found under Program Files — did the Inno Setup install step succeed?"
          }

          # Read the compiler's version for the LOG ONLY. It is never a gate.
          #
          # This check has now been wrong twice, in both directions, and each
          # mistake cost a full release run:
          #   1. FileMajorPart/FileMinorPart — ISCC.exe leaves the fixed
          #      VS_FIXEDFILEINFO block zeroed, so the floor read 0.0 and
          #      rejected the 6.x chocolatey had just installed.
          #   2. ProductVersion/FileVersion — zeroed too. Regexing them out
          #      produced a confident, wrong 0.0 and threw again, without ever
          #      reaching the fallback meant to cover exactly that case.
          #
          # The lesson is not "find a third field". It is that the floor was
          # never load-bearing: ISCC itself rejects ArchitecturesAllowed=
          # x64compatible when it is too old, and that is the authoritative
          # answer. The check only ever existed to turn ISCC's terse "Unknown
          # value" into a sentence naming the cause — so it now runs AFTER the
          # compile, on the failure path, where being wrong costs nothing.
          #
          # Do not cast these strings to [version] either: the field is
          # free-form (git.exe reports '2.48.1.windows.1') and the cast throws
          # under the $ErrorActionPreference='Stop' above.
          $fi = (Get-Item $iscc).VersionInfo
          $isccVersion = $null
          foreach ($s in @($fi.ProductVersion, $fi.FileVersion)) {
            if ($s -and $s -match '(\d+)\.(\d+)') {
              $candidate = [version]::new([int]$Matches[1], [int]$Matches[2])
              # A 0.x reading means "this binary does not report a version",
              # not "this binary is ancient".
              if ($candidate.Major -gt 0) { $isccVersion = $candidate; break }
            }
          }
          if ($isccVersion) {
            Write-Host "ISCC $isccVersion at $iscc"
          } else {
            Write-Host "ISCC at $iscc (the binary reports no usable version)"
          }

          $stage = "openote-$env:VERSION-windows-x64"
          & $iscc `
            "/DAppVersion=$env:VERSION" `
            "/DStageDir=$(Resolve-Path $stage)" `
            packaging/windows/openote.iss
          if ($LASTEXITCODE -ne 0) {
            $reported = if ($isccVersion) { "$isccVersion" } else { "no version" }
            throw "ISCC failed with exit code $LASTEXITCODE. If the error above " +
              "mentions ArchitecturesAllowed, openote.iss needs Inno Setup 6.3+ " +
              "for x64compatible and this compiler reports $reported."
          }
          Move-Item packaging/windows/openote-*-setup.exe . -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            openote-*.zip
            openote-*-setup.exe
          if-no-files-found: error

  linux:
    name: linux x64
    needs: version
    # Pinned, not `ubuntu-latest`, and the pin is now 24.04 — it was 22.04, and
    # moving it was forced. TWO properties of this host are inherited by the
    # artifact and they pull in opposite directions:
    #
    #   * glibc. A binary inherits the build host's floor, so an OLDER base
    #     reaches more distros. 22.04 gave 2.35; 24.04 gives 2.39.
    #   * libmpv's SONAME. media_kit_video's Linux plugin LINKS libmpv
    #     (`target_link_libraries(... PkgConfig::mpv ...)`), so whichever
    #     libmpv-dev this host has is baked in and resolved by ld.so before
    #     main(). Jammy's is mpv 0.34 → libmpv.so.1; noble's is 0.37 →
    #     libmpv.so.2.
    #
    # Nothing currently shipping outside 22.04 has libmpv.so.1 — Ubuntu 24.04,
    # Debian 12/13, Mint 22, Fedora and openSUSE are all .so.2. Staying on
    # jammy would therefore have produced packages that INSTALL cleanly on
    # those distros (the declared dependency is satisfied) and then die at exec
    # with "error while loading shared libraries: libmpv.so.1". Not degraded
    # video — no launch at all, on the majority of the machines the .deb and
    # .rpm target. The soname wins; the glibc floor is the price.
    #
    # What that price is: Debian 12 (glibc 2.36) and Ubuntu 22.04 (2.35) cannot
    # run 0.4.2. They stay on 0.4.1. Getting both properties would mean
    # building inside a `container: debian:12` — glibc 2.36 AND libmpv.so.2 —
    # which is the right answer if those users matter and is a rewrite of this
    # job rather than a label change. It also decouples the floor from GitHub's
    # image lifecycle, which the 22.04 deprecation on 2026-09-17 makes a
    # question that has to be answered anyway.
    #
    # The "Verify shared-library dependencies" step below asserts the soname
    # rather than trusting this comment to stay true.
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop toolchain
        run: |
          sudo apt-get update
          # libmpv-dev and libepoxy-dev are media_kit_video's: its Linux plugin
          # links against both through pkg-config, and pkg_check_modules is not
          # REQUIRED there — so without them the plugin builds against nothing
          # and ships a release where video silently does not work.
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev libepoxy-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/onote_core

      - name: Build Rust core
        working-directory: rust/onote_core
        run: cargo build --release

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build app
        working-directory: app
        run: |
          flutter pub get
          dart run pdfrx:remove_wasm_modules
          dart run tool/strip_web_assets.dart
          flutter build linux --release --build-name="$VERSION"
          dart run tool/shake_icons.dart linux

      # Loader contract: libonote_core.so next to the 'openote' binary. The
      # CMake hook installs it; this is belt-and-braces.
      - name: Stage native library into the bundle
        run: cp rust/onote_core/target/release/libonote_core.so app/build/linux/x64/release/bundle/

      # The check that would have caught shipping a jammy-linked binary to
      # Fedora. libmpv is a LINK-time dependency of media_kit_video's plugin,
      # so its soname is a property of the artifact, not of this file's
      # comments — and the failure mode it guards is silent: the package
      # installs, then the app does not start. Assert the soname the binary
      # actually asks for against the one the packages declare.
      - name: Verify shared-library dependencies
        run: |
          set -euo pipefail
          plugin=app/build/linux/x64/release/bundle/lib/libmedia_kit_video_plugin.so
          [ -f "$plugin" ] || { echo "::error::$plugin is missing — media_kit_video did not build, so there is no video in this release"; exit 1; }
          soname="$(objdump -p "$plugin" | awk '/NEEDED/ && /libmpv/ {print $2}')"
          echo "libmedia_kit_video_plugin.so needs: ${soname:-<nothing>}"
          if [ "$soname" != "libmpv.so.2" ]; then
            echo "::error::expected libmpv.so.2, got '${soname:-<nothing>}'."
            echo "::error::The packages declare libmpv2 (deb) and mpv-libs (rpm), both of which provide .so.2."
            echo "::error::A mismatch here ships packages that install cleanly and then fail to launch."
            exit 1
          fi

      # Fallback artifact: always produced, works everywhere tar does.
      - name: Package tar.gz
        run: |
          cp -r app/build/linux/x64/release/bundle "openote-${VERSION}-linux-x64"
          tar czf "openote-${VERSION}-linux-x64.tar.gz" "openote-${VERSION}-linux-x64"

      # A .deb and an .rpm, replacing the AppImage.
      #
      # The AppImage was one file you chmod +x and ran, and it stayed that way
      # forever: AppImages deliberately touch nothing, so there was no menu
      # entry and no icon. The ask was "the equivalent of an .exe I download" —
      # something you double-click, that installs, and that then shows up in
      # the applications menu. On Linux that is a distro package, and it takes
      # two to cover the desktop: .deb for Debian/Ubuntu/Mint, .rpm for
      # Fedora/RHEL/openSUSE.
      #
      # The .tar.gz above stays as the universal fallback for everything else
      # (Arch, NixOS, a locked-down machine), so dropping the AppImage narrows
      # convenience, not reach.
      #
      # `rpm` provides rpmbuild; it is not on the runner by default. Both
      # packages are built from ONE staged tree by the script, so they cannot
      # drift apart.
      - name: Install packaging tools
        run: sudo apt-get install -y rpm

      - name: Package .deb and .rpm
        run: |
          chmod +x packaging/linux/build-packages.sh
          packaging/linux/build-packages.sh             "$VERSION"             "app/build/linux/x64/release/bundle"             "$PWD"

      # Prove the packages actually contain what they promise, here rather than
      # on a user's machine. `dpkg-deb -c` and `rpm -qlp` list the payload
      # without installing it.
      - name: Verify package contents
        run: |
          set -euo pipefail
          deb="openote-${VERSION}-linux-amd64.deb"
          rpm="openote-${VERSION}-linux-x86_64.rpm"
          for f in "$deb" "$rpm"; do
            [ -f "$f" ] || { echo "::error::$f was not produced"; exit 1; }
          done
          # `dpkg-deb -c` prints ls -l style, and a SYMLINK line ends with its
          # target: "... ./usr/bin/openote -> /opt/openote/openote". Taking the
          # last field would therefore record the target and never the link, so
          # /usr/bin/openote would be reported missing from a package that has
          # it. Strip the " -> ..." tail first, then take the path.
          echo "--- deb ---"
          dpkg-deb -c "$deb" | sed 's/ -> .*$//' | awk '{print $NF}' > deb.list
          echo "--- rpm ---"; rpm -qlp "$rpm" > rpm.list
          for want in /opt/openote/openote                       /opt/openote/libonote_core.so                       /opt/openote/data/flutter_assets                       /usr/bin/openote                       /usr/share/applications/org.openote.openote.desktop                       /usr/share/icons/hicolor/512x512/apps/openote.png; do
            grep -q -- "$want" deb.list || { echo "::error::deb is missing $want"; exit 1; }
            grep -q -- "$want" rpm.list || { echo "::error::rpm is missing $want"; exit 1; }
          done
          echo "both packages carry the binary, the Rust core, the launcher and the icon"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            openote-*.tar.gz
            openote-*.deb
            openote-*.rpm
          if-no-files-found: error

  macos:
    name: macos universal
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/onote_core

      # Flutter's macOS release build is universal by default; the dylib must
      # match or Intel Macs silently lose the Rust core through a Rosetta
      # arch mismatch.
      - name: Build Rust core (universal)
        working-directory: rust/onote_core
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output libonote_core.dylib \
            target/aarch64-apple-darwin/release/libonote_core.dylib \
            target/x86_64-apple-darwin/release/libonote_core.dylib

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build app
        working-directory: app
        run: |
          flutter pub get
          dart run pdfrx:remove_wasm_modules
          dart run tool/strip_web_assets.dart
          flutter build macos --release --build-name="$VERSION"

      # Loader contract: dylib next to the exe = Contents/MacOS/. Inserting it
      # breaks Flutter's ad-hoc signature seal, so re-sign ad-hoc or the app
      # is killed on launch.
      # Ad-hoc signing is REQUIRED, not cosmetic: an unsigned binary will not
      # launch at all on Apple Silicon. It is not notarisation — see the
      # release notes below for what the user still has to do.
      #
      # `--deep` is deprecated by Apple and was also doing something nobody
      # intended: it re-signed the bundle with NO entitlements, silently
      # dropping the app-sandbox flag that Release.entitlements used to set.
      # The shipped app therefore worked by accident. Signing the inserted
      # dylib first and then the bundle WITH its entitlements makes the result
      # deliberate and identical to a local `flutter build macos`.
      - name: Bundle dylib and re-sign (ad-hoc)
        run: |
          APP=app/build/macos/Build/Products/Release/openote.app
          cp rust/onote_core/libonote_core.dylib "$APP/Contents/MacOS/"
          codesign --force --sign - "$APP/Contents/MacOS/libonote_core.dylib"
          codesign --force --sign - \
            --entitlements app/macos/Runner/Release.entitlements "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Package dmg (unsigned)
        run: |
          APP=app/build/macos/Build/Products/Release/openote.app
          mkdir dmg-staging
          cp -R "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Openote" -srcfolder dmg-staging -ov \
            -format UDZO "openote-${VERSION}-macos-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: openote-*.dmg
          if-no-files-found: error

  release:
    name: draft release
    needs: [version, windows, linux, macos]
    # A dry run stops here: the artifacts are on the run page for inspection
    # and nothing reaches the Releases tab.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release + upload assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Openote ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
          body: |
            <!-- Draft: review, edit, then publish. -->

            ## Downloads
            - **Windows**: `openote-*-windows-x64-setup.exe` — the installer.
              Installs for your user only, so it never asks for an
              administrator password. (Prefer no installer? The
              `…-windows-x64.zip` is the same build — unzip it anywhere and run
              `openote.exe` from inside the folder it extracts.)
            - **Linux**: `openote-*-linux-amd64.deb` on Ubuntu/Debian/Mint, or
              `openote-*-linux-x86_64.rpm` on Fedora/RHEL/openSUSE. Double-click
              it, or install from a terminal — then Openote is in your
              applications menu like any other program, and `.onote` files are
              named and iconed correctly in your file manager. (Neither fits?
              The `.tar.gz` runs from anywhere: extract it and run `./openote`
              inside. It has no package manager to ask for libmpv, so if you
              want video to play in the page, install `mpv-libs` on Fedora or
              `libmpv2` on Ubuntu/Debian yourself — the app says so too.)
            - **macOS**: `openote-*-macos-universal.dmg` — drag Openote to Applications.

            ---

            ### Both warnings below are expected. Here is exactly why.

            Openote is not code-signed. Signing certificates cost a few hundred
            dollars a year each, and while the project is this young that money
            is better spent on nothing at all. Nothing about the warnings says
            the software is unsafe — only that we have not paid to tell your
            operating system who we are. Every build here is produced by the
            public workflow in this repository, from the tagged commit, and you
            can read both.

            **Windows: "Windows protected your PC"**
            Click **More info**, then **Run anyway**. SmartScreen shows this for
            any installer it has not seen often enough to have an opinion about.

            **macOS: "openote is damaged and can't be opened"**
            Gatekeeper quarantines unsigned downloads. After copying to
            Applications, clear the flag once:

                xattr -cr /Applications/openote.app

            Your notes never leave your machine either way — see the project's
            local-first principles.
