name: Release

# Tag-triggered release builds (v0.2.0 → tag v0.2.0). Cut tags only from a
# green master: this workflow does not re-run tests (CI gates every push); it
# builds, packages, and DRAFTS the release for human review — nothing goes
# public without a person pressing publish.
#
# The explicit `cargo build` steps are kept even though the CMake hook now
# builds the core during `flutter build` on Windows/Linux: release artifacts
# must not depend on the hook alone, and macOS has no hook (Xcode project).
on:
  push:
    tags: ['v*']
  # A dry run: build and package everything, upload the artifacts, and create
  # NO release. Added because the platform jobs went un-run for their whole
  # existence — the only way to exercise them was to cut a real tag, and a tag
  # that fails leaves a half-made release and a name that has to be deleted in
  # two places before it can be reused. Now the expensive, breakable half can
  # be tried on demand.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 0.3.0 (must match app/pubspec.yaml). Builds artifacts only — no release is created.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Single source of truth: the git tag. Fails fast when app/pubspec.yaml
  # disagrees so the two can never drift silently — bump pubspec, commit, then
  # tag. (pubspec is 'M.m.p+build'; only M.m.p is compared.)
  version:
    name: derive version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"     # a dry run names its own version
          else
            VERSION="${GITHUB_REF_NAME#v}"   # a tag IS the version
          fi
          PUBSPEC="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' app/pubspec.yaml)"
          if [ "$VERSION" != "$PUBSPEC" ]; then
            echo "::error::version ${VERSION} does not match app/pubspec.yaml version ${PUBSPEC}."
            echo "::error::Bump app/pubspec.yaml, commit and PUSH, then delete the tag in BOTH places (git tag -d v${VERSION} AND git push --delete origin v${VERSION}) before re-tagging — a stale local tag is the usual cause."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Refuse to run against a tag that ALREADY has a release.
      #
      # `draft: true` in the release job is not the safety net it looks like.
      # softprops/action-gh-release only honours it on the CREATE path; when a
      # release already exists for the tag it takes the update path and passes
      # `draft: existingRelease.draft` verbatim. So re-running a tag whose
      # release was published would attach every installer to a LIVE public
      # release, overwrite its title and body with the draft text — comment
      # marker and all — and never once pause for the human review this
      # workflow's own header promises.
      #
      # This is the exact shape of the 0.3.0 incident: the first tag failed the
      # guard above, a release was created by hand to compensate, and the tag
      # was then a loaded gun. Fail in eight seconds instead of at minute forty.
      - name: Refuse to overwrite an existing release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::A release already exists for ${TAG}."
            echo "::error::Publishing into it would bypass the draft review step entirely."
            echo "::error::Delete that release (and this tag) first, or ship the next patch version."
            exit 1
          fi

  windows:
    name: windows x64
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/onote_core

      - name: Build Rust core
        working-directory: rust/onote_core
        run: cargo build --release

      # Pinned to the version CI tests — see the comment in ci.yml. A tag
      # must never build with a toolchain no push has been verified against.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Build app
        working-directory: app
        run: |
          flutter pub get
          # 4.0 MB of web-only PDFium WASM that desktop cannot execute; the
          # package documents this command for release builds.
          dart run pdfrx:remove_wasm_modules
          dart run tool/strip_web_assets.dart
          # 48,423,670 B of libmpv and ANGLE — 48% of the whole download —
          # stop being copied next to openote.exe and become the one-off
          # fetch in lib/media/video_engine.dart. The next step packages them.
          dart run tool/split_video_engine.dart
          flutter build windows --release --build-name=$env:VERSION
          dart run tool/shake_icons.dart windows

      # The download the app fetches the first time somebody plays a video.
      #
      # Built from the very DLLs this build would otherwise have shipped, and
      # CHECKED against the hashes the app pins. Those two must agree or every
      # student's download is refused with a hash mismatch and video simply
      # stops working — an upgrade of media_kit is exactly how that happens,
      # and it must fail here, in the release, not in the field.
      - name: Package the video player
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'app/build/windows/x64'
          $manifest = Get-Content app/lib/media/video_engine.dart -Raw
          # EngineFile('name.dll', 123, 'hash') — across the line break the
          # formatter puts in.
          $pins = [regex]::Matches(
            $manifest,
            "EngineFile\('([^']+)',\s*(\d+),\s*\r?\n?\s*'([0-9a-f]{64})'\)")
          if ($pins.Count -lt 7) {
            throw "Only $($pins.Count) engine files found in video_engine.dart — the pinned manifest could not be read, so nothing here is verified."
          }
          $stage = New-Item -ItemType Directory -Force -Path video-engine
          foreach ($m in $pins) {
            $name = $m.Groups[1].Value
            $bytes = [int64]$m.Groups[2].Value
            $want = $m.Groups[3].Value
            $found = Get-ChildItem -Path $src -Filter $name -Recurse -File |
              Select-Object -First 1
            if (-not $found) { throw "$name is not under $src — did split_video_engine run before the build?" }
            $got = (Get-FileHash $found.FullName -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $want -or $found.Length -ne $bytes) {
              throw "$name does not match what the app pins ($got / $($found.Length) vs $want / $bytes). Update the manifest in app/lib/media/video_engine.dart, or the first video anybody plays will refuse the download."
            }
            Copy-Item $found.FullName $stage
          }
          Compress-Archive -Path "$($stage.FullName)/*" `
            -DestinationPath "openote-$env:VERSION-video-engine-windows-x64.zip"

      # And the shipped bundle must NOT contain them, or the split saved
      # nothing and the release notes are wrong about the download size.
      - name: Verify the engine is not in the bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'app/build/windows/x64/runner/Release'
          $leaked = Get-ChildItem $rel -File |
            Where-Object { $_.Name -in @('libmpv-2.dll','libEGL.dll','libGLESv2.dll','d3dcompiler_47.dll','vk_swiftshader.dll','vulkan-1.dll','zlib.dll') }
          if ($leaked) {
            throw "The video engine is still in the bundle: $($leaked.Name -join ', '). split_video_engine.dart did not take effect."
          }

      # The FFI loader (app/lib/core/onote_ffi.dart) looks next to the exe
      # first — the DLL must sit beside openote.exe in the zip. The CMake hook
      # already bundles it; the explicit copy is belt-and-braces.
      - name: Package zip (DLL next to the exe)
        shell: pwsh
        run: |
          $stage = "openote-$env:VERSION-windows-x64"
          Copy-Item -Recurse app/build/windows/x64/runner/Release $stage
          Copy-Item rust/onote_core/target/release/onote_core.dll $stage/ -Force
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

      # The setup .exe — what a non-technical user should be downloading.
      # The zip stays beside it: it is the answer for a locked-down machine, a
      # USB stick, or someone who wants to look inside before running anything,
      # and keeping it costs one line.
      #
      # Inno Setup is not preinstalled on the runner.
      #
      # NOT pinned to an exact version, which reverses an earlier decision, and
      # the reversal has a reason. The pin was 6.2.2 — and openote.iss uses
      # `ArchitecturesAllowed=x64compatible`, which Inno Setup only understands
      # from 6.3. A pin that cannot compile the script it is pinned for is not
      # caution, it is a guaranteed failure. Verifying the floor is the part
      # that was actually worth having, so that is what the next step does.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # ${env:ProgramFiles(x86)} — the BRACES are load-bearing. PowerShell
          # ends an unbraced variable name at the first character that cannot
          # appear in one, and `(` is one of those: "$env:ProgramFiles(x86)\..."
          # expands to "C:\Program Files(x86)\...", a path that does not exist.
          # The step then failed on a directory nobody had ever typed.
          # Find ISCC rather than hardcoding 'Inno Setup 6': the install step
          # above is deliberately unpinned, so a future chocolatey package that
          # ships 7.x would land in a directory this path does not name — and
          # the failure would arrive after the whole Rust + Flutter build.
          #
          # Look in the conventional 'Inno Setup <n>' directories FIRST. The
          # recursive sweep below is the fallback, not the default: recursing
          # both Program Files trees took 4m24s on the runner, and every second
          # of it was spent after the Rust and Flutter builds had already run.
          $roots = @(${env:ProgramFiles(x86)}, $env:ProgramFiles) | Where-Object { $_ }
          $candidates = Get-ChildItem -Path $roots -Filter 'Inno Setup*' -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName 'ISCC.exe' } |
            Where-Object { Test-Path $_ } |
            Sort-Object { if ($_ -match 'Inno Setup\s+(\d+)') { [int]$Matches[1] } else { 0 } }
          $iscc = $candidates | Select-Object -Last 1
          if (-not $iscc) {
            $iscc = Get-ChildItem -Path $roots -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -Last 1 -ExpandProperty FullName
          }
          if (-not $iscc) {
            throw "ISCC.exe not found under Program Files — did the Inno Setup install step succeed?"
          }

          # Read the compiler's version for the LOG ONLY. It is never a gate.
          #
          # This check has now been wrong twice, in both directions, and each
          # mistake cost a full release run:
          #   1. FileMajorPart/FileMinorPart — ISCC.exe leaves the fixed
          #      VS_FIXEDFILEINFO block zeroed, so the floor read 0.0 and
          #      rejected the 6.x chocolatey had just installed.
          #   2. ProductVersion/FileVersion — zeroed too. Regexing them out
          #      produced a confident, wrong 0.0 and threw again, without ever
          #      reaching the fallback meant to cover exactly that case.
          #
          # The lesson is not "find a third field". It is that the floor was
          # never load-bearing: ISCC itself rejects ArchitecturesAllowed=
          # x64compatible when it is too old, and that is the authoritative
          # answer. The check only ever existed to turn ISCC's terse "Unknown
          # value" into a sentence naming the cause — so it now runs AFTER the
          # compile, on the failure path, where being wrong costs nothing.
          #
          # Do not cast these strings to [version] either: the field is
          # free-form (git.exe reports '2.48.1.windows.1') and the cast throws
          # under the $ErrorActionPreference='Stop' above.
          $fi = (Get-Item $iscc).VersionInfo
          $isccVersion = $null
          foreach ($s in @($fi.ProductVersion, $fi.FileVersion)) {
            if ($s -and $s -match '(\d+)\.(\d+)') {
              $candidate = [version]::new([int]$Matches[1], [int]$Matches[2])
              # A 0.x reading means "this binary does not report a version",
              # not "this binary is ancient".
              if ($candidate.Major -gt 0) { $isccVersion = $candidate; break }
            }
          }
          if ($isccVersion) {
            Write-Host "ISCC $isccVersion at $iscc"
          } else {
            Write-Host "ISCC at $iscc (the binary reports no usable version)"
          }

          $stage = "openote-$env:VERSION-windows-x64"
          & $iscc `
            "/DAppVersion=$env:VERSION" `
            "/DStageDir=$(Resolve-Path $stage)" `
            packaging/windows/openote.iss
          if ($LASTEXITCODE -ne 0) {
            $reported = if ($isccVersion) { "$isccVersion" } else { "no version" }
            throw "ISCC failed with exit code $LASTEXITCODE. If the error above " +
              "mentions ArchitecturesAllowed, openote.iss needs Inno Setup 6.3+ " +
              "for x64compatible and this compiler reports $reported."
          }
          Move-Item packaging/windows/openote-*-setup.exe . -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            openote-*.zip
            openote-*-setup.exe
          if-no-files-found: error
      # `openote-*.zip` above already picks up the video-player archive; it is
      # named so that it can never end with `-setup.exe`, which is the exact
      # string the in-app updater matches on to find the installer
      # (app/lib/update/app_update.dart, and video_engine_test.dart pins it).

  linux:
    name: linux x64
    needs: version
    # Inside a container the runner's default shell resolves to plain sh
    # (dash), not bash — v0.8.0's dry run died on this job's first bashism,
    # `set -o pipefail` ("Illegal option"). Every script here was written and
    # syntax-checked as bash, so say so; debian:12 ships bash in the base image.
    defaults:
      run:
        shell: bash
    # Built INSIDE a debian:12 (bookworm) container rather than on a runner
    # image. TWO properties of the build host are inherited by the artifact,
    # and on the stock runner images they pull in opposite directions:
    #
    #   * glibc. A binary inherits the build host's floor, so an OLDER base
    #     reaches more distros. ubuntu-22.04 gave 2.35; ubuntu-24.04 gives 2.39.
    #   * libmpv's SONAME. media_kit_video's Linux plugin LINKS libmpv
    #     (`target_link_libraries(... PkgConfig::mpv ...)`), so whichever
    #     libmpv-dev this host has is baked in and resolved by ld.so before
    #     main(). Jammy's is mpv 0.34 → libmpv.so.1; noble's is 0.37 →
    #     libmpv.so.2.
    #
    # Nothing currently shipping outside 22.04 has libmpv.so.1 — Ubuntu 24.04,
    # Debian 12/13, Mint 22, Fedora and openSUSE are all .so.2. So jammy was
    # never really available: its packages INSTALL cleanly on those distros
    # (the declared dependency is satisfied) and then die at exec with "error
    # while loading shared libraries: libmpv.so.1" — not degraded video, no
    # launch at all. But noble's 2.39 floor was the other half of the same
    # trap: it locked Debian 12 and Ubuntu 22.04 out of 0.4.2 completely, and
    # what those users saw was the loader's own "version `GLIBC_2.38' not
    # found", which names no package and suggests no fix.
    #
    # debian:12 is the base that has BOTH, which is the whole reason for the
    # container: glibc 2.36 (libc6 2.36-9+deb12u*) AND libmpv-dev 0.35.1-4,
    # whose runtime package is `libmpv2` → libmpv.so.2 — exactly what
    # packaging/linux/build-packages.sh already declares in Depends. Bookworm
    # is also the OLDEST Debian that pairs them: bullseye would drop the floor
    # to glibc 2.31, but its mpv is 0.32 → libmpv.so.1, straight back to the
    # no-launch failure above.
    #
    # A container also decouples the floor from GitHub's image lifecycle. The
    # runner label now only has to host Docker, so the ubuntu-22.04 removal on
    # 2026-09-17 — and every deprecation after it — stops being a question the
    # release has to answer.
    #
    # Two steps below assert all of this instead of trusting this comment to
    # stay true: "Verify the glibc floor" pins the 2.36 ceiling, and "Verify
    # shared-library dependencies" pins the soname.
    runs-on: ubuntu-latest
    container:
      image: debian:12
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Every step here runs as root in a bare image, so an apt that stopped to
      # ask a configuration question would hang the job rather than fail it.
      DEBIAN_FRONTEND: noninteractive
    steps:
      # BEFORE actions/checkout, deliberately: debian:12 ships no git, and
      # checkout without one silently falls back to unpacking a source tarball.
      # That leaves no .git, and Flutter runs git against its own SDK.
      #
      # Note there is no `sudo` anywhere in this job. The image does not
      # include it and these steps are already root, so the `sudo apt-get` this
      # job used to run would now be "sudo: command not found".
      - name: Install the build toolchain
        run: |
          set -eux
          apt-get update
          # What each group is for. The base image has no compiler, no CA
          # bundle and no VCS, so all of it has to be named:
          #   ca-certificates   TWO plugins download a prebuilt pdfium over
          #                     HTTPS during CMake configure (printing's
          #                     DownloadProject, pdfium_flutter's
          #                     file(DOWNLOAD)). With no CA bundle in the image
          #                     the TLS handshake fails and the build dies in
          #                     cmake, long before any Dart runs.
          #   curl              rustup's installer and flutter-action fetch.
          #   git               see above, plus Flutter's own version probe.
          #   unzip zip xz-utils file
          #                     Flutter's documented Linux prerequisites; the
          #                     SDK unpacks its engine artifacts with them.
          #   zstd              actions/cache reaches for it first and falls
          #                     back to gzip with a warning when it is absent.
          #                     Both caches in this job (flutter-action's and
          #                     rust-cache's) would otherwise take the slow
          #                     path on every release.
          #   build-essential   gcc/g++ (Rust needs `cc` to link at all) and
          #                     binutils, whose objdump the two verify steps
          #                     below depend on.
          #   clang cmake ninja-build pkg-config liblzma-dev libstdc++-12-dev
          #                     the `flutter build linux` toolchain proper.
          #                     gcc 12 is bookworm's default, so -12- is the
          #                     matching libstdc++ dev package on this base.
          #   libgtk-3-dev      GTK itself, and also the gtk+-unix-print-3.0
          #                     .pc file that the printing plugin looks up with
          #                     pkg_check_modules(... REQUIRED ...) — that one
          #                     is a hard configure failure, not a silent one.
          #   libmpv-dev libepoxy-dev
          #                     media_kit_video's: its Linux plugin links both
          #                     through pkg-config, and pkg_check_modules is
          #                     NOT REQUIRED there — so without them the plugin
          #                     builds against nothing and ships a release
          #                     where video silently does not work.
          #   rpm               provides rpmbuild for build-packages.sh.
          # jq is not ours: subosito/flutter-action's setup.sh dies without it
          # ("jq not found", v0.8.0's first tag build). The ubuntu runner image
          # preinstalls it, so the gap only shows inside a bare container.
          apt-get install -y --no-install-recommends \
            ca-certificates curl git unzip zip xz-utils zstd file jq \
            build-essential clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev libepoxy-dev \
            rpm
          # The workspace is bind-mounted from the runner (uid 1001) while this
          # container is root, so git sees a tree owned by someone else and
          # refuses it with "detected dubious ownership" — which would take out
          # checkout and Flutter's SDK probe alike.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      # In the container too, so the core links against bookworm's glibc like
      # everything else. A Rust core built outside would be the one .so in the
      # bundle with a 2.39 floor, and the app would fail to load at startup on
      # the exact machines this job exists to reach.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/onote_core

      - name: Build Rust core
        working-directory: rust/onote_core
        run: cargo build --release

      # Pinned to the version CI tests — see the comment in ci.yml. A tag
      # must never build with a toolchain no push has been verified against.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Build app
        working-directory: app
        run: |
          flutter pub get
          dart run pdfrx:remove_wasm_modules
          dart run tool/strip_web_assets.dart
          flutter build linux --release --build-name="$VERSION"
          dart run tool/shake_icons.dart linux

      # Loader contract: libonote_core.so next to the 'openote' binary. The
      # CMake hook installs it; this is belt-and-braces.
      - name: Stage native library into the bundle
        run: cp rust/onote_core/target/release/libonote_core.so app/build/linux/x64/release/bundle/

      # The check that would have caught shipping a jammy-linked binary to
      # Fedora. libmpv is a LINK-time dependency of media_kit_video's plugin,
      # so its soname is a property of the artifact, not of this file's
      # comments — and the failure mode it guards is silent: the package
      # installs, then the app does not start. Assert the soname the binary
      # actually asks for against the one the packages declare.
      - name: Verify shared-library dependencies
        run: |
          set -euo pipefail
          plugin=app/build/linux/x64/release/bundle/lib/libmedia_kit_video_plugin.so
          [ -f "$plugin" ] || { echo "::error::$plugin is missing — media_kit_video did not build, so there is no video in this release"; exit 1; }
          soname="$(objdump -p "$plugin" | awk '/NEEDED/ && /libmpv/ {print $2}')"
          echo "libmedia_kit_video_plugin.so needs: ${soname:-<nothing>}"
          if [ "$soname" != "libmpv.so.2" ]; then
            echo "::error::expected libmpv.so.2, got '${soname:-<nothing>}'."
            echo "::error::The packages declare libmpv2 (deb) and mpv-libs (rpm), both of which provide .so.2."
            echo "::error::A mismatch here ships packages that install cleanly and then fail to launch."
            exit 1
          fi

      # The container tag is the INTENT; this is the measurement. A binary's
      # real floor is the highest versioned glibc symbol anything in the bundle
      # references — a property of what the compiler emitted, not of the image
      # name — so a dependency that starts calling a newer symbol, or an edit
      # to the base above, is caught here rather than by a student whose app
      # will not start. That failure gives them "version `GLIBC_2.38' not
      # found" and nothing else to go on.
      #
      # This checks the bundled prebuilt .so files too (pdfium, mpv's deps):
      # they are loaded at startup like everything else, so their floor is the
      # app's floor.
      - name: Verify the glibc floor
        run: |
          set -euo pipefail
          bundle=app/build/linux/x64/release/bundle
          # Per-file breakdown FIRST, so a failure below names its culprit —
          # the aggregate alone says "GLIBC_2.38" without saying which library
          # demanded it, and the prebuilt ones (pdfium) are the likely suspects.
          for f in "$bundle/openote" "$bundle/libonote_core.so" "$bundle"/lib/*.so; do
            m="$({ objdump -T "$f" 2>/dev/null || true; } \
              | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -uV | tail -1 || true)"
            echo "  ${m:-none}  ${f##*/}"
          done | sort -V
          floor="$(
            { objdump -T "$bundle/openote" "$bundle/libonote_core.so" "$bundle"/lib/*.so 2>/dev/null || true; } \
              | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -uV | tail -1 || true
          )"
          echo "highest glibc symbol version required by this bundle: ${floor:-none found}"
          # 2.36 is bookworm's. Higher means the build escaped the container's
          # baseline and Debian 12 is shut out again.
          if [ -n "$floor" ] && [ "$(printf '%s\n2.36\n' "$floor" | sort -V | tail -1)" != "2.36" ]; then
            echo "::error::this bundle needs glibc ${floor}, above debian:12's 2.36."
            echo "::error::Debian 12 and Fedora 37/38 users would get a loader error naming GLIBC_${floor} and no app."
            echo "::error::Something is being built or bundled outside the container — check that step."
            exit 1
          fi
          echo "floor is at or below 2.36: Debian 12+, Ubuntu 24.04+, Mint 22+, Fedora 37+ can run this"

      # Fallback artifact: always produced, works everywhere tar does.
      - name: Package tar.gz
        run: |
          cp -r app/build/linux/x64/release/bundle "openote-${VERSION}-linux-x64"
          tar czf "openote-${VERSION}-linux-x64.tar.gz" "openote-${VERSION}-linux-x64"

      # A .deb and an .rpm, replacing the AppImage.
      #
      # The AppImage was one file you chmod +x and ran, and it stayed that way
      # forever: AppImages deliberately touch nothing, so there was no menu
      # entry and no icon. The ask was "the equivalent of an .exe I download" —
      # something you double-click, that installs, and that then shows up in
      # the applications menu. On Linux that is a distro package, and it takes
      # two to cover the desktop: .deb for Debian/Ubuntu/Mint, .rpm for
      # Fedora/RHEL/openSUSE.
      #
      # The .tar.gz above stays as the universal fallback for everything else
      # (Arch, NixOS, a locked-down machine), so dropping the AppImage narrows
      # convenience, not reach.
      #
      # rpmbuild comes from the `rpm` package. It is installed with the rest of
      # the toolchain at the top of this job rather than in a separate `sudo
      # apt-get` step here, because the container has no sudo — one apt call,
      # in one place, is also one fewer thing to forget. Both packages are
      # built from ONE staged tree by the script, so they cannot drift apart.
      - name: Package .deb and .rpm
        run: |
          chmod +x packaging/linux/build-packages.sh
          packaging/linux/build-packages.sh             "$VERSION"             "app/build/linux/x64/release/bundle"             "$PWD"

      # Prove the packages actually contain what they promise, here rather than
      # on a user's machine. `dpkg-deb -c` and `rpm -qlp` list the payload
      # without installing it.
      - name: Verify package contents
        run: |
          set -euo pipefail
          deb="openote-${VERSION}-linux-amd64.deb"
          rpm="openote-${VERSION}-linux-x86_64.rpm"
          for f in "$deb" "$rpm"; do
            [ -f "$f" ] || { echo "::error::$f was not produced"; exit 1; }
          done
          # `dpkg-deb -c` prints ls -l style, and a SYMLINK line ends with its
          # target: "... ./usr/bin/openote -> /opt/openote/openote". Taking the
          # last field would therefore record the target and never the link, so
          # /usr/bin/openote would be reported missing from a package that has
          # it. Strip the " -> ..." tail first, then take the path.
          echo "--- deb ---"
          dpkg-deb -c "$deb" | sed 's/ -> .*$//' | awk '{print $NF}' > deb.list
          echo "--- rpm ---"; rpm -qlp "$rpm" > rpm.list
          for want in /opt/openote/openote                       /opt/openote/libonote_core.so                       /opt/openote/data/flutter_assets                       /usr/bin/openote                       /usr/share/applications/org.openote.openote.desktop                       /usr/share/icons/hicolor/512x512/apps/openote.png; do
            grep -q -- "$want" deb.list || { echo "::error::deb is missing $want"; exit 1; }
            grep -q -- "$want" rpm.list || { echo "::error::rpm is missing $want"; exit 1; }
          done
          echo "both packages carry the binary, the Rust core, the launcher and the icon"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            openote-*.tar.gz
            openote-*.deb
            openote-*.rpm
          if-no-files-found: error

  macos:
    name: macos universal
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/onote_core

      # Flutter's macOS release build is universal by default; the dylib must
      # match or Intel Macs silently lose the Rust core through a Rosetta
      # arch mismatch.
      #
      # KEPT ON PURPOSE even though app/macos/build_onote_core.sh now does the
      # same work inside `flutter build macos`. That build phase has never run
      # on a Mac (it was written on a Windows machine — see app/README.md), and
      # a tag is the worst possible place to discover it is wrong: the app
      # would still build and still launch, just without OneNote import,
      # because the loader falls back to the Dart engine on purpose. These
      # steps make the shipped dmg independent of that question. Delete them
      # once the hook has been confirmed on real hardware, not before.
      # The two are consistent by construction: same crate, same two targets,
      # same lipo, and the copy below overwrites whatever the hook placed.
      - name: Build Rust core (universal)
        working-directory: rust/onote_core
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output libonote_core.dylib \
            target/aarch64-apple-darwin/release/libonote_core.dylib \
            target/x86_64-apple-darwin/release/libonote_core.dylib

      # Pinned to the version CI tests — see the comment in ci.yml. A tag
      # must never build with a toolchain no push has been verified against.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Build app
        working-directory: app
        run: |
          flutter pub get
          dart run pdfrx:remove_wasm_modules
          dart run tool/strip_web_assets.dart
          flutter build macos --release --build-name="$VERSION"

      # Loader contract: dylib next to the exe = Contents/MacOS/. Inserting it
      # breaks Flutter's ad-hoc signature seal, so re-sign ad-hoc or the app
      # is killed on launch.
      # Ad-hoc signing is REQUIRED, not cosmetic: an unsigned binary will not
      # launch at all on Apple Silicon. It is not notarisation — see the
      # release notes below for what the user still has to do.
      #
      # `--deep` is deprecated by Apple and was also doing something nobody
      # intended: it re-signed the bundle with NO entitlements, silently
      # dropping the app-sandbox flag that Release.entitlements used to set.
      # The shipped app therefore worked by accident. Signing the inserted
      # dylib first and then the bundle WITH its entitlements makes the result
      # deliberate and identical to a local `flutter build macos`.
      - name: Bundle dylib and re-sign (ad-hoc)
        run: |
          APP=app/build/macos/Build/Products/Release/openote.app
          cp rust/onote_core/libonote_core.dylib "$APP/Contents/MacOS/"
          codesign --force --sign - "$APP/Contents/MacOS/libonote_core.dylib"
          codesign --force --sign - \
            --entitlements app/macos/Runner/Release.entitlements "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Package dmg (unsigned)
        run: |
          APP=app/build/macos/Build/Products/Release/openote.app
          mkdir dmg-staging
          cp -R "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Openote" -srcfolder dmg-staging -ov \
            -format UDZO "openote-${VERSION}-macos-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: openote-*.dmg
          if-no-files-found: error

  release:
    name: draft release
    needs: [version, windows, linux, macos]
    # A dry run stops here: the artifacts are on the run page for inspection
    # and nothing reaches the Releases tab.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release + upload assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Openote ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
          # THE BODY IS WHAT THE IN-APP UPDATE DIALOG SHOWS (update-through
          # -app fetches the release body as the "what's new" text). So it
          # MUST LEAD with a human "What's new" — the actual features and
          # fixes, in the user's language — ABOVE the download boilerplate.
          # Eric, 2026-08-10: "ensure the patch notes actually describe
          # whats new at the start rather than the generic info since thats
          # whats seen in app." CHANGELOG.md's newest section is the source.
          # The "What's new" below is written for THIS release before
          # tagging; rewrite it from the CHANGELOG before cutting the next
          # one — a stale top section is worse than the old placeholder.
          #
          # AND IT MUST OPEN SHORT. Eric, 2026-08-17: "we only show the first
          # few lines in the app which is where most people will see it. We
          # want to keep the overview compact and have the most important
          # /exciting changes for a user right at the top every time." So the
          # FIRST section is a handful of one-line bullets — the best of the
          # release, one line each, no line wrapping — and the detail follows
          # underneath. `release_notes_test.dart` reads this file and fails
          # if that opening grows. The rule, and why, is written down in
          # docs/RELEASING.md §"Writing the notes".
          body: |
            <!-- Draft: review — the What's new below was written with the
                 tag, from CHANGELOG.md's 1.0.0 section — then publish. -->

            ## What's new

            - **Bring a OneNote notebook over by signing in** — no exporting, no files.
            - **Handwriting, equations, pictures, tables and attachments all come too.**
            - **Subpages stay subpages**, and your notebook's own page links still work.
            - **Write on a PDF or a photo**, and the ink stays readable on any theme.
            - **Make your own pen colours**, or take one off the page with the eyedropper.
            - **A Page tab, and undo and redo you can always reach.**
            - **A shared notebook's history stops repeating itself as you type.**

            ## All of it, in more detail

            **Your notes, out of OneNote, without exporting anything.** This is most of
            the release.

            - **Sign in to Microsoft, pick a notebook, and it arrives.** No exporting, no
              files, no leaving the app. On a Mac or on Linux this is not merely the
              easier way, it is the **only** way: OneNote for Mac cannot export a notebook
              at all, and there is no OneNote for Linux.
            - **The notebook fills in while you watch.** Each section is written as it
              arrives, so you can read the parts already in while the rest is still
              coming, and keep typing the whole time. A line above the page says how far
              through it is.
            - **Handwriting comes too.** So do equations, pictures, tables, lists, your
              to-do ticks, and **attachments** — which the file import has never managed.
              A real five-year notebook of 332 pages, 64,000 pen strokes and 548 equations
              came over three times running with nothing missing, in about three minutes.
            - **Subpages stay subpages**, indented under the page they belong to, a
              subpage of a subpage included.
            - **Your notebook's own links work.** A contents page that pointed at other
              pages still points at them, now inside Openote. A link to something you did
              not import still opens OneNote, exactly as before.
            - **An import that goes wrong keeps the pages it already brought you**, tells
              you how many are in, and offers to finish the rest later. It survives
              closing the app. If you stopped it yourself, it never restarts on its own.
            - **Openote learns nothing about you.** It asks to read your notebooks and
              nothing else — no name, no email, no address book, no files, no calendar —
              and it cannot change anything in OneNote even if it wanted to. There is no
              Openote server, so your notes go from Microsoft to your own machine and
              nowhere else.
            - **You do not have to sign in at all.** The exported-file route is still
              there on the same screen, described side by side, because not wanting to
              sign in to a Microsoft account is a perfectly good reason not to.

            **Writing and drawing.**

            - **Ink over a picture or a PDF stays readable.** Default ink works out its
              colour when it is drawn: dark on a light page, light on a dark one, and dark
              again over a scan or a slide, which brings its own background.
            - **Make your own pen colours.** The pen and highlighter swatches have a **+**
              that opens the full picker — a palette, a colour wheel and a hex box — and
              the colours you mix are there beside the ready-made ones next time. There is
              an **eyedropper** too: take the colour of a photograph, a PDF, a diagram or
              someone else's handwriting and write in it.
            - **A delete button on whatever is selected**, so lassoed handwriting can be
              got rid of without a keyboard.
            - **The pen puts itself away.** Bringing a pen near the screen switches to
              handwriting on its own, and reaching for the mouse switches back — so there
              is no "Done" button and no mode to leave. A tool you picked yourself stays
              picked.
            - **Table columns fit what is in them**, and you can drag any column's edge to
              the width you want.

            **Finding your way around.**

            - **The page's own settings are a tab.** Ruling, sheet or canvas, paper size,
              the grid and the zoom are on a **Page** tab now instead of a third strip of
              toolbar.
            - **Undo and redo are always there**, above the tabs, instead of only on Home.
            - **The word count is up top**, beside the other things you glance at.
            - **Outline, tags and links are one button** — the same question asked three
              ways — and you move between them inside the panel.
            - **Openote speaks six more languages** and picks yours by itself, with the
              language list sorted so you can find yours.
            - **The pointer changes over everything you can click**, not just most of it.

            ## The fine print

            - **1.0 is a promise about your notes, not a claim of completeness.** The file
              format is documented and stable, Openote never sends your notes anywhere,
              and nothing it does to them is reversible only by hand.
            - **The six translations have not been read by a native speaker yet.** They
              are seeds, and they are there so that fixing them is possible; Settings ▸
              Appearance ▸ Language links straight to how. If a word is wrong in your
              language, that is the contribution the project most wants.
            - **A pen's side button may not reach Openote on Windows.** The eraser end of
              a pen works, and so does the eraser tool. Hold the button near the screen:
              if the eraser on the Draw tab does not light up, Openote is not being told
              about the button at all.
            - **A notebook that 1.0 has typed into is read-only on Openote 0.9 and
              earlier.** Those versions will open it and show you everything, but
              will not let you add to it — 1.0 records an edit as the characters
              that changed rather than the whole paragraph, and a version that
              cannot read that must not write on top of it. Update the other
              devices that share a notebook and it never comes up.
            - **macOS and Linux are the least-tested platforms by far.**
            - Openote is still in active development. Updates are worth taking, but a
              major update may occasionally break a feature.
            - On Linux, whether double-clicking a notebook *folder* opens Openote depends
              on your file manager; the **Open this notebook** file inside the folder
              works either way.

            ## For the technically curious

            The import talks to the Microsoft Graph API directly — sign-in is the device
            code flow, so nothing is stored but a refresh token in the OS keychain, and
            the app registration asks for `Notes.Read` and nothing else. OneNote never
            tells you a page's depth in the hierarchy, but it will *filter* on it, so
            subpages are recovered by asking which pages are at each level and comparing
            the answers. Throttling is honoured rather than fought: `Retry-After` is
            obeyed, a throttled batch is retried whole instead of exploded into twenty
            requests, and a server fault is retried without narrowing the pipe — which
            are different failures and were being treated as one. Everything a page
            carries is converted rather than screenshotted: InkML into the same stroke
            format the pen writes, MathML into LaTeX, HTML into the live-Markdown model.
            Editing a paragraph now appends a splice — `at`, `del`, `ins`, in UTF-16
            code units snapped to whole runes — instead of the whole block, which
            was 52.6% of a real workspace's op log; forty autosaves of a
            thousand-character paragraph fell from about 60 KB to 12 KB, and the
            per-save cost stopped growing with the paragraph. It carries a
            fingerprint of the text it was computed against and a reader refuses a
            patch that does not match, so two devices' logs still merge
            last-writer-wins rather than interleaving into prose neither person
            wrote. That is the `v: 2` envelope, and the reason it was spent before
            1.0 rather than after.
            Over the cycle the test suite grew from 2,764 to 3,094, and the app carries a
            [manual pre-release checklist](https://github.com/icmric/openote/blob/master/docs/pre-release-checklist.md)
            for the failures a headless suite cannot see.

            ## Downloads
            - **Windows**: `openote-*-windows-x64-setup.exe` — the installer.
              Installs for your user only, so it never asks for an
              administrator password. (Prefer no installer? The
              `…-windows-x64.zip` is the same build — unzip it anywhere and run
              `openote.exe` from inside the folder it extracts.)
            - **Linux**: `openote-*-linux-amd64.deb` on Ubuntu/Debian/Mint, or
              `openote-*-linux-x86_64.rpm` on Fedora/RHEL/openSUSE. Double-click
              it, or install from a terminal — then Openote is in your
              applications menu like any other program. To open a notebook from
              your file manager, double-click the **Open this notebook** file
              inside the notebook's folder; whether double-clicking the folder
              itself opens Openote depends on which file manager you use.
              (Neither package fits? The `.tar.gz` runs from anywhere: extract
              it and run `./openote` inside. It has no package manager to ask
              for libmpv, so if you want video to play in the page, install
              `mpv-libs` on Fedora or `libmpv2` on Ubuntu/Debian yourself —
              the app says so too.)
            - **macOS**: `openote-*-macos-universal.dmg` — drag Openote to Applications.

            ---

            ### Both warnings below are expected. Here is exactly why.

            Openote is not code-signed. Signing certificates cost a few hundred
            dollars a year each, and while the project is this young that money
            is better spent on nothing at all. Nothing about the warnings says
            the software is unsafe — only that we have not paid to tell your
            operating system who we are. Every build here is produced by the
            public workflow in this repository, from the tagged commit, and you
            can read both.

            **Windows: "Windows protected your PC"**

            Click **More info**, then **Run anyway**. SmartScreen shows this for
            any installer it has not seen often enough to have an opinion about.

            **macOS: "openote is damaged and can't be opened"**

            Gatekeeper quarantines unsigned downloads. After copying to
            Applications, clear the flag once:

                xattr -cr /Applications/openote.app

            Your notes never leave your machine either way — see the project's
            local-first principles.
