# Deploy openote.org to Cloudflare Workers.
#
# The site is one static HTML file plus a Worker with a single cached API
# route, so there is no build step — wrangler uploads site/ as static assets
# and worker/index.js as the script.
#
# Deliberately NOT triggered by the release workflow: the page reads the latest
# release through /api/latest at request time, so a new release appears on the
# site without redeploying anything.
name: Site

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; never cancel one half-uploaded.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `npx wrangler@<pinned>` rather than `cloudflare/wrangler-action`, for
      # one concrete reason: the action installs **wrangler 3.90** by default,
      # and wrangler 3 cannot read `wrangler.jsonc` at all (JSONC config landed
      # in 3.91), nor the static-assets config this project uses (a v4
      # feature). The first deploy therefore failed with a baffling "Missing
      # entry-point" — baffling because the entry point is right there, in a
      # file wrangler was silently ignoring.
      #
      # The action's `wranglerVersion` input would fix that too, but calling
      # wrangler directly removes the layer that chose the wrong version in the
      # first place, and drops a Node-20 deprecation warning with it. Two
      # environment variables is the whole of what the action was doing here.
      #
      # PINNED, not floating. This is the version the Worker's routing,
      # caching and asset handling were actually verified against; a deploy
      # tool that changes underneath a release is the kind of thing you find
      # out about from a user. Bump it deliberately.
      - name: Deploy
        run: npx --yes wrangler@4.118.0 deploy
        env:
          # A scoped API token, not the global key: Workers Scripts:Edit plus
          # Account Settings:Read. See docs/RELEASING.md §2a.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
