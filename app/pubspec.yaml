name: openote
description: An open-source, natively cross-platform alternative to Microsoft OneNote.
publish_to: "none"
# Single source of truth for the app version; release.yml derives artifact
# names from the git tag and asserts it matches this field.
version: 0.6.2+11

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Storage — the .onote container (File Format Spec 10)
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24 # bundles SQLite (incl. FTS5) on all desktop/mobile targets
  path_provider: ^2.1.0
  path: ^1.9.0
  # Identity (Data Model Spec §2 — UUIDv7)
  uuid: ^4.4.0
  # Ink (Ink Data Spec 13 — perfect-freehand outlines)
  perfect_freehand: ^2.3.0
  # Math (Math Input Spec 12 — native KaTeX-subset rendering)
  flutter_math_fork: ^0.7.2
  # Image insertion & save dialogs
  file_selector: ^1.0.3
  # PDF export (pure Dart)
  pdf: ^3.10.0
  # Printing (P13) — drives the OS print dialog with the same vector page the
  # exporter builds. Apache-2.0, same author as `pdf`; audited per LICENSING.md.
  printing: ^5.13.0
  # FFI to the Rust core (onote-core) — optional at runtime; the app falls
  # back to the pure-Dart engine when the native library isn't present.
  ffi: ^2.1.0
  super_clipboard: ^0.9.1
  desktop_drop: ^0.7.1
  pdfrx: ^2.2.24
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# Run once after `flutter create` + `flutter pub get`:
#   dart run flutter_launcher_icons
# to generate the Windows .ico / macOS / etc. app icons from the logo.
flutter_launcher_icons:
  image_path: "assets/icon/openote_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/openote_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/openote_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/openote_icon.png
    # Spell-check wordlist (TEXT-11). Loaded lazily on a background isolate the
    # first time text is edited — never at startup.
    - assets/dict/en_us.txt.gz
  # Bundled type (style guide §4.1): the app previously rendered in each OS's
  # system font, so no two platforms looked alike. Inter is the UI + note face,
  # JetBrains Mono the code face; both OFL-1.1 (texts beside the assets, rows
  # in LICENSING.md). The onoteFontFallback chain stays BEHIND these — it is
  # what resolves math/symbol glyphs the primary faces lack.
  fonts:
    - family: Inter
      fonts:
        - { asset: assets/fonts/inter/Inter-Regular.ttf, weight: 400 }
        - { asset: assets/fonts/inter/Inter-Italic.ttf, weight: 400, style: italic }
        - { asset: assets/fonts/inter/Inter-Medium.ttf, weight: 500 }
        - { asset: assets/fonts/inter/Inter-MediumItalic.ttf, weight: 500, style: italic }
        - { asset: assets/fonts/inter/Inter-SemiBold.ttf, weight: 600 }
        - { asset: assets/fonts/inter/Inter-SemiBoldItalic.ttf, weight: 600, style: italic }
        - { asset: assets/fonts/inter/Inter-Bold.ttf, weight: 700 }
        - { asset: assets/fonts/inter/Inter-BoldItalic.ttf, weight: 700, style: italic }
    # Regular and Bold only. The italic faces were 557 KB for a combination
    # nothing in the app's own chrome asks for — code spans are upright, and
    # the only route to italic mono is a user setting a text block to this
    # family in the font picker and then italicising part of it. That still
    # works; the engine synthesises the oblique, which for a monospaced face
    # at body size is a difference nobody has reported noticing. Add the faces
    # back if anyone does.
    - family: JetBrains Mono
      fonts:
        - { asset: assets/fonts/jetbrains-mono/JetBrainsMono-Regular.ttf, weight: 400 }
        - { asset: assets/fonts/jetbrains-mono/JetBrainsMono-Bold.ttf, weight: 700 }
