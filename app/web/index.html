<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Openote — a notebook that keeps your notes in files you own. Try the demo in your browser; nothing here is saved.">

  <!-- Hand-written, NOT generated by `flutter create`. §16 of the v1.0.2 plan
       records why: a throwaway `flutter create --platforms=web` also silently
       removed pdfium_flutter from all three desktop plugin registrants, which
       is a broken desktop build in exchange for a web folder. -->

  <title>Openote demo</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    /* The gap before Flutter paints. Plain CSS so it shows even if the main
       bundle is slow or fails: a blank white page reads as a broken link. */
    html, body { margin: 0; padding: 0; height: 100%; background: #faf9f7; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #1c1b1a; }
    }
    #boot {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font: 500 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #6b6a68;
    }
    @media (prefers-color-scheme: dark) { #boot { color: #8a8886; } }
  </style>
</head>
<body>
  <!-- Removed by the app on its first frame. -->
  <div id="boot">Loading the demo…</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) b.remove();
    });
    // If the app never gets as far as a first frame, say so here. Flutter's own
    // in-window error screen cannot help with a failure that happens before it
    // exists, and the alternative is a page that sits on "Loading…" forever.
    function bootFailed(detail) {
      var b = document.getElementById('boot');
      if (!b || b.dataset.failed) return;
      b.dataset.failed = '1';
      b.textContent = 'The demo did not start. ' + detail;
    }
    window.addEventListener('error', function (e) {
      bootFailed((e.error && e.error.toString()) || e.message || '');
    });
    window.addEventListener('unhandledrejection', function (e) {
      bootFailed((e.reason && e.reason.toString()) || '');
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
