# cargo-deny configuration for the writing checker.
#
# The mirror image of ../onote_core/deny.toml. That crate is the PERMISSIVE
# tier and refuses anything beyond five licences, because a single copyleft
# crate in its graph would void the promise that anyone can read .onote files.
# This crate is part of the AGPL application, so it may carry more — Harper's
# tree brings MPL-2.0 (file-level copyleft, which the MPL itself says may be
# combined with the GPL family), BSD, ISC and a few data licences.
#
# What this file is for is the opposite guard: the list below is exactly what
# the tree uses today (checked with `cargo deny check licenses`), so a Harper
# upgrade that pulls in something new — a strong-copyleft crate, or a licence
# nobody has read — fails CI and is looked at, instead of arriving silently.
# Adding to this list is a licensing decision: record it in LICENSING.md.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "BSD-2-Clause",
    "CC0-1.0",
    "0BSD",
    # Weak, file-level copyleft: unmodified, with source available on crates.io.
    # Three crates, all pulled in by Harper's HTML sanitiser.
    "MPL-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# This crate itself is AGPL-3.0-or-later and `publish = false`.
ignore = true

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
